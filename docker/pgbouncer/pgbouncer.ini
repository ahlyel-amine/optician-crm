; PgBouncer — transaction pooling. This file is the other half of TENANT-08; the Django
; half is CONN_MAX_AGE = 0 in config/settings/base.py. Both halves are asserted by
; tests/test_connection_budget.py.

[databases]
; Bare wildcard fallback. From the PgBouncer documentation: "* acts as a fallback
; database: if the exact name does not exist, its value is taken as connection string for
; the requested database." This is why a newly provisioned client database needs no
; PgBouncer configuration change and no reload.
;
; Do NOT replace this with a prefix wildcard such as `tenant_* = ...`. Prefix wildcards
; appear only in blog posts; the official documentation shows only the bare `*`. A prefix
; wildcard that silently fails to match would route a tenant database to the wrong entry
; (threat T-02-06). The ini-parsing test enforces that the only starred key is `*` itself.
* = host=db port=5432

; The database `auth_query` runs in — see auth_dbname below. It must be a *named* entry:
; PgBouncer resolves auth_dbname against the [databases] section and refuses to start the
; lookup with `authentication database "..." is not configured` if it is not there, and
; the bare `*` fallback does not satisfy it.
;
; It is a separate key rather than a plain `postgres = ...` so the name states its purpose:
; anything routed here is a credential lookup, not client traffic.
pgbouncer_auth_db = host=db port=5432 dbname=postgres

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

pool_mode = transaction

; Ceiling on client-side connections. With CONN_MAX_AGE = 0 the real client count is
; bounded by concurrency (gunicorn workers x threads, plus Celery concurrency), not by the
; number of client businesses, so 1000 is generous rather than tight.
max_client_conn = 1000

; Server connections per (user, database) pair.
default_pool_size = 5

; CRITICAL — this single line is the difference between a connection budget of
; O(concurrency) and one of O(client_count).
;
; Pools are keyed by (user, database), so N client databases means N pools. With
; min_pool_size = 0 a pool holds server connections only while it has active clients, so
; the fleet-wide ceiling is (peak concurrent transactions + not-yet-reaped idle), which is
; independent of how many clients exist. Set this to 5 instead and 300 clients would pin
; 1500 server connections against a max_connections of 200 — the database stops accepting
; connections and every client is down at once.
;
; Asserted by test_tenant08_pgbouncer_holds_no_idle_connections_per_idle_client.
min_pool_size = 0

reserve_pool_size = 2

; Reap idle server connections fast (default 600). Shortens the "not-yet-reaped" slack
; term in the budget above.
server_idle_timeout = 60

; Reap the auto-created wildcard database entries (default 3600), so a client that has not
; been touched in five minutes occupies nothing at all.
autodb_idle_timeout = 300

server_lifetime = 3600

auth_type = scram-sha-256

; CRITICAL — the difference between "a new client is a provisioning operation" and "a new
; client is a deployment".
;
; The provisioner creates one login role per client business (`optique_u000047`) long
; after PgBouncer started, and web/Celery traffic authenticates as that role. A static
; auth_file only ever knows the roles somebody last typed into it, so without the three
; lines below every provisioned client is refused here with `SASL authentication failed`
; and Phase 3's first authenticated request never reaches PostgreSQL.
;
; auth_file remains, and is now a two-line development fallback rather than the mechanism:
; PgBouncer cannot look up the credential it needs in order to run the lookup, so
; auth_user's own password has to be readable from a file, and the admin console
; (admin_users below) authenticates from the file too — auth_query does not apply to it.
; No per-client credential may ever be written there; a test asserts that.
auth_file = /etc/pgbouncer/userlist.txt
auth_user = pgbouncer_auth

; PgBouncer runs auth_query inside the database the client asked for. With one database
; per client that would mean installing the lookup function into every client database —
; and into every client database created after this line was written, which is exactly the
; deployment step being removed. auth_dbname pins the lookup to one database instead.
; It must name an entry in [databases]; the bare `*` fallback does not satisfy it.
auth_dbname = pgbouncer_auth_db

; Not `SELECT usename, passwd FROM pg_shadow WHERE usename = $1`, which is the shape most
; documentation shows: pg_shadow is superuser-only, so that version forces auth_user to be
; a superuser and makes the pooler's stored credential the keys to the cluster. The
; SECURITY DEFINER function in docker/postgres/init/01-pgbouncer-auth.sql does the
; privileged read instead, with EXECUTE granted to pgbouncer_auth alone and revoked from
; PUBLIC.
auth_query = SELECT username, password FROM public.pgbouncer_get_auth($1)

; psycopg sends extra_float_digits at startup. Under transaction pooling PgBouncer must be
; told which startup parameters it may ignore, or the connection is refused.
ignore_startup_parameters = extra_float_digits

; Statement-level logging lives on the PostgreSQL side (log_statement = all) so we can
; prove that a request issues no session SQL at connect (threat T-02-02).
admin_users = optique_app
stats_users = optique_app

log_connections = 1
log_disconnections = 1
