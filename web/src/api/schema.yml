openapi: 3.0.3
info:
  title: API Optique
  version: 1.0.0
paths:
  /api/auth/connexion/:
    post:
      operationId: auth_connexion_create
      description: |-
        `POST /api/auth/connexion/` — établit la session et renvoie l'amorçage complet.

        **Protégée par CSRF bien qu'anonyme.** Les vues DRF sont `csrf_exempt` au niveau du
        middleware et `SessionAuthentication` n'impose le CSRF qu'aux utilisateurs déjà
        authentifiés : sans ce décorateur, la connexion serait la seule écriture non protégée
        du produit. Le login CSRF est une vraie attaque — on force une victime dans la session
        de l'attaquant, qui relit ensuite ce qu'elle y a saisi. La SPA appelle déjà
        `/api/auth/csrf/` au montage (`03-UI-SPEC.md` 6), donc cela ne lui coûte rien.

        `login()` fait tourner la clé de session : la fixation de session est traitée par
        Django et **ne doit pas** être réimplémentée (menace T-03-50).
      summary: Ouvrir une session
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Connexion'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Connexion'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Connexion'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Amorcage'
          description: ''
  /api/auth/csrf/:
    get:
      operationId: auth_csrf_retrieve
      description: Appelé par la SPA au montage de l'écran de connexion, avant le
        premier POST.
      summary: Poser le cookie CSRF
      tags:
      - auth
      security:
      - {}
      responses:
        '204':
          description: No response body
  /api/auth/deconnexion/:
    post:
      operationId: auth_deconnexion_create
      description: |-
        `POST /api/auth/deconnexion/` — `logout()` vide la ligne de session.

        Révocation réelle et immédiate : il n'y a aucune fenêtre d'expiration à attendre
        parce qu'il n'y a plus rien à expirer. C'est la moitié « révocation » de l'argument
        session-contre-jeton, et le test rejoue la clé après coup pour le prouver.
      summary: Fermer la session
      tags:
      - auth
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/auth/moi/:
    get:
      operationId: auth_moi_retrieve
      description: |-
        `GET /api/auth/moi/` — tout l'amorçage de la SPA, en une requête.

        Le compte, l'affaire, les entrées de navigation autorisées, les magasins accordés et
        le catalogue des droits. Une requête plutôt que cinq : c'est la première chose qui se
        passe après la connexion, et chaque aller-retour supplémentaire est une fraction de
        seconde d'écran vide au comptoir.
      summary: L'amorçage de la SPA
      tags:
      - auth
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Amorcage'
          description: ''
  /api/auth/mot-de-passe/:
    post:
      operationId: auth_mot_de_passe_create
      description: |-
        `POST /api/auth/mot-de-passe/` — le changement par l'intéressé.

        Efface `doit_changer_mot_de_passe`, ce qui libère la SPA de la route
        `/mot-de-passe` sur laquelle elle atterrit tant que le drapeau est vrai. Renvoie
        l'amorçage à jour, pour que l'interface n'ait pas à deviner l'état d'après un 200.
      summary: Changer son mot de passe
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangementMotDePasse'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChangementMotDePasse'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChangementMotDePasse'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Amorcage'
          description: ''
  /api/clients/:
    get:
      operationId: clients_list
      description: 'Liste de candidats classés. **Aucun appelant ne doit auto-sélectionner
        sur un nom.** Aucun seuil ne sépare « Mhamed ↔ Mohammed » (0,333) de « Fatima
        ↔ Fatiha » (0,571) : le classement est inversé, et un faux positif au comptoir
        ouvre la fiche du voisin — avec ses ordonnances, c''est une divulgation de
        donnée de santé, pas une gêne d''interface. `correspondance_exacte` ne se
        pose que sur un numéro de téléphone complet, jamais sur un nom.'
      summary: Chercher ou lister les clients
      parameters:
      - name: ordering
        required: false
        in: query
        description: Quel champ utiliser pour classer les résultats.
        schema:
          type: string
      - in: query
        name: search
        schema:
          type: string
        description: 'Le terme brut saisi au comptoir — nom ou téléphone, dans n''importe
          quelle graphie et n''importe quelle écriture. Il est normalisé **par le
          serveur** : ne rien retirer, ne rien plier et ne rien filtrer côté client.
          Sous deux caractères, rien n''est cherché. Au plus 20 candidats sont rendus,
          chacun portant `score` et `raison`.'
      tags:
      - clients
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FicheClient'
          description: ''
    post:
      operationId: clients_create
      description: |-
        La ressource client. **Deux absences délibérées, écrites ici pour être trouvées.**

        ## 1. Le mixin de portée magasin est absent, et ce n'est pas un oubli

        Un client appartient à l'**affaire**, pas à un point de vente : il achète à Anfa
        aujourd'hui et à Maârif dans six mois, et c'est la même personne (décision D-4a). Le
        scoper produirait deux fiches pour un humain, donc deux historiques de prescription
        pour un seul œil. **Le raisonnement complet, avec sa conséquence clinique, vit dans
        la docstring de `clients.Client`** (`domaine/clients/models.py`), qui dit aussi
        pourquoi la garde de `plateforme/projection/checks.py` est structurellement aveugle
        ici — elle ne se déclenche que sur un modèle scopé, donc elle ne dira ni qu'il manque
        une portée, ni qu'il n'en faut pas. La garde **positive** vit au plan 04-04, à côté
        de `Ordonnance`.

        **Pourquoi ce paragraphe ne nomme pas le mixin.** Le plan 04-03 fait de son absence
        un critère grepable sur ce fichier ; l'y écrire rendrait le critère rouge sur le
        fichier même qui le respecte. C'est la même arbitrage qu'au plan 04-01 avec
        `unaccent`, et la même leçon : un critère qui attrape sa propre prose est un critère
        mal écrit — il devrait chercher une **ligne d'import** ou une **base de classe**, pas
        un mot. Noté pour `04-09`.

        Conséquence à ne pas manquer : la portée des lignes de cette ressource est
        l'**affaire entière**, et c'est `client.voir` qui en garde la porte. Il n'y a rien à
        filtrer dans `get_queryset()` à ce titre.

        ## 2. Pas de `DestroyModelMixin`, et `delete` absent de `http_method_names`

        Une fiche client se **désactive** (`actif = False`). L'article 211 du CGI impose dix
        ans de conservation, et la phase 6 posera un `PROTECT` depuis la facture. `put` est
        absent pour la raison de `VueComptes` : un remplacement complet n'a aucun usage ici
        et offrirait une seconde porte d'écriture à tenir en cohérence avec la première.

        ## 3. Aucun nouveau paramètre de requête, et c'est écrit pour que l'absence se lise

        `search` figure **déjà** dans `PARAMETRES_RESERVES`
        (`plateforme/projection/filtres.py`), donc `?search=` n'y ajoute rien et le fichier
        n'est pas touché par ce plan. Tout autre nom — `?q=`, `?telephone=` — devrait y
        entrer **dans le même commit**, sans quoi il produirait le refus unique.
        `test_client01_tout_parametre_hors_liste_blanche_est_refuse` vérifie les trois noms
        que l'on écrit sans y penser.
      summary: Créer une fiche client
      tags:
      - clients
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FicheClient'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FicheClient'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FicheClient'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FicheClient'
          description: ''
  /api/clients/{id}/:
    get:
      operationId: clients_retrieve
      description: |-
