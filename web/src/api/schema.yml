      summary: La fiche d'un client
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un(une) valeur entière unique identifiant ce(cette) client.
        required: true
      tags:
      - clients
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FicheClient'
          description: ''
    patch:
      operationId: clients_partial_update
      description: |-
        La ressource client. **Deux absences délibérées, écrites ici pour être trouvées.**

